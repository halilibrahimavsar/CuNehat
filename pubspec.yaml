flutter_native_splash:
  # Açılış ekranı ikonla aynı kimliği taşımalı: siyah zemine oturtulan tam
  # ikon (kendi zemini olduğu için) ekranın ortasında kutu gibi duruyordu.
  # Zemin ikonun mavisi, görsel de şeffaf foreground katmanı.
  # Gradyanın görsel ortasından örneklenen düz renk. Gradyan bitmap'i zemin
  # olarak verilirse uzun ekranlarda gerilip ikondan farklı görünüyor.
  color: "#061B49"
  image: "assets/images/app_icon_foreground.png"
  fullscreen: true


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/images/google_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  # Adaptive ikon (Android 8+): launcher kendi maskesini uygular ve
  # foreground'un kenarlarından ~%17 kırpar. app_icon_foreground.png bu
  # yüzden şeffaf zeminli; içerik tuvalin ortadaki ~%72'sinde (C'nin dış
  # çapı tam %72). Paket ayrıca XML'de %16 inset uyguluyor, yani işaret
  # 108dp'lik tuvalde 72dp'lik görünür alanın ~%73'ünü kaplıyor.
  # Bu katmanlar olmadan launcher legacy bitmap'i beyaz bir rozetin içine
  # küçültüyor ve ikon diğer uygulamaların yanında bariz bozuk duruyor.
  # Arka plan düz renk değil görsel: işaretin altındaki gradyan kimliğin
  # yarısı, düz renge düşürülürse ikon cansızlaşıyor.
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  # Android 13+ temalı ikon: sistem alfa kanalını duvar kağıdından türettiği
  # tek renge boyar, o yüzden katman düz siluet.
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"
  min_sdk_android: 24
     
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

